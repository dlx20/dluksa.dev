<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <!-- Phosphor glow: a blurred copy of the glyph under the sharp one -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- CRT scanlines: a dark line every 2 units -->
    <pattern id="scanlines" width="32" height="2" patternUnits="userSpaceOnUse">
      <rect width="32" height="1" fill="#000" fill-opacity="0.22"/>
    </pattern>
    <clipPath id="tile"><rect width="32" height="32" rx="7"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="32" height="32" fill="#141a10"/>
    <!-- d_ in the accent color -->
    <g filter="url(#glow)">
      <circle cx="12.5" cy="19.5" r="4.5" fill="none" stroke="#c3e88d" stroke-width="3"/>
      <line x1="17" y1="8" x2="17" y2="24" stroke="#c3e88d" stroke-width="3" stroke-linecap="round"/>
      <rect x="20" y="23" width="6" height="3" rx="0.75" fill="#c3e88d"/>
    </g>
    <rect width="32" height="32" fill="url(#scanlines)"/>
  </g>
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="6.25" fill="none" stroke="#c3e88d" stroke-opacity="0.3" stroke-width="1.5"/>
</svg>
